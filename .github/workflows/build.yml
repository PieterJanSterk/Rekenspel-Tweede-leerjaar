# Test the game, build an app for Windows, macOS and Linux, and (for a version
# tag such as v1.0.0) publish the three downloads as a GitHub Release.
#
#   - every push to main and every pull request:  tests + a build of all three apps
#   - push a tag like v1.0.0:                      the same, then a Release with the zips
#   - "Run workflow" button on the Actions tab:    the same, without a Release
#
# Each freshly built app is started with --selftest (no window needed) before it
# is zipped, so a broken package fails here instead of in a classroom.

name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The tests and the self-check open no window and play no sound.
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install -r requirements.txt pyyaml
      - run: python run_tests.py

  build:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux }
          - { os: windows-latest, name: windows }
          - { os: macos-latest,   name: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the game's requirements and PyInstaller
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Install evdev for Sinden light guns (Linux only, optional)
        if: runner.os == 'Linux'
        shell: bash
        run: python -m pip install -r requirements-linux.txt || echo "evdev not installed - the mouse fallback is used"

      - name: Build the app
        run: python -m PyInstaller --noconfirm tafels.spec

      - name: Self-test the built app (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAFELS_SELFTEST_REPORT: ${{ runner.temp }}/selftest.txt
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then APP="dist/Tafels.app/Contents/MacOS/Tafels"; else APP="dist/Tafels"; fi
          "$APP" --selftest || { cat "$TAFELS_SELFTEST_REPORT" || true; exit 1; }
          cat "$TAFELS_SELFTEST_REPORT"

      - name: Self-test the built app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAFELS_SELFTEST_REPORT: ${{ runner.temp }}\selftest.txt
        run: |
          # The Windows app has no console window, so wait for it and read its report file.
          $p = Start-Process -FilePath "dist\Tafels.exe" -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path $env:TAFELS_SELFTEST_REPORT) { Get-Content $env:TAFELS_SELFTEST_REPORT }
          exit $p.ExitCode

      - name: Zip it
        run: python package_release.py ${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: Tafels-${{ matrix.name }}
          path: release/*.zip
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
